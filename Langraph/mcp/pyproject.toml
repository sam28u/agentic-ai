[project]
name = "my-mcp-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sam28u", email = "sambhufirst11@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.3",
